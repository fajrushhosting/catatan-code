<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CodePad Pro</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background: #121212; color: #e0e0e0; 
            font-family: 'Courier New', Courier, monospace; 
            overflow: hidden; 
        }
        /* Textarea murni tanpa librari tambahan menjamin 0 lag saat paste kode panjang */
        textarea {
            width: 100%; height: 100%; border: none; background: transparent; 
            color: inherit; padding: 15px; box-sizing: border-box; 
            font-size: 14px; outline: none; resize: none;
            white-space: pre; overflow-wrap: normal; overflow-x: auto;
        }
        #status { 
            position: fixed; bottom: 15px; right: 15px; 
            font-size: 12px; color: #aaa; background: rgba(0,0,0,0.7); 
            padding: 5px 10px; border-radius: 6px; 
            pointer-events: none; transition: opacity 0.3s;
        }
    </style>
</head>
<body>
    <textarea id="editor" placeholder="Paste atau ketik kode di sini... (Tanpa Limit)"></textarea>
    <div id="status">Memuat...</div>

    <script>
        // Kredensial Supabase Anda
        const SUPABASE_URL = 'https://dxdgwngzbwkqynbreied.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_lwS_DxwYhAHzafLFMDQF0Q_DGOUXIYi';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const editor = document.getElementById('editor');
        const status = document.getElementById('status');
        const NOTE_ID = 1; // Menggunakan 1 ID untuk 1 catatan panjang
        
        let saveTimeout;

        // 1. Muat data seketika dari LocalStorage agar tidak ada blank screen
        editor.value = localStorage.getItem('codepad_backup') || '';

        // 2. Ambil data terbaru dari Supabase
        async function loadFromSupabase() {
            try {
                const { data, error } = await supabase.from('notes').select('content').eq('id', NOTE_ID).single();
                if (data && data.content) {
                    if (editor.value !== data.content) {
                        editor.value = data.content;
                        localStorage.setItem('codepad_backup', data.content);
                    }
                }
                status.innerText = 'Selesai disinkronisasi';
                setTimeout(() => status.style.opacity = '0', 2000);
            } catch (e) {
                status.innerText = 'Mode Offline (Tersimpan Lokal)';
            }
        }

        // 3. Fungsi simpan ke Supabase
        async function saveToSupabase(content) {
            status.style.opacity = '1';
            status.innerText = 'Menyimpan ke Cloud...';
            try {
                const { error } = await supabase.from('notes').upsert({ id: NOTE_ID, content: content });
                if (error) throw error;
                status.innerText = 'Tersimpan';
                setTimeout(() => status.style.opacity = '0', 2000);
            } catch (e) {
                status.innerText = 'Gagal menyimpan ke cloud';
            }
        }

        // 4. Deteksi ketikan (Simpan ke lokal secara instan, ke cloud secara debounce)
        editor.addEventListener('input', () => {
            const val = editor.value;
            localStorage.setItem('codepad_backup', val); // Anti-hilang instan
            
            status.style.opacity = '1';
            status.innerText = 'Mengetik...';

            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => saveToSupabase(val), 1500); // Simpan ke Supabase setelah 1.5 detik diam
        });

        // 5. Simpan PAKSA saat pengguna pindah aplikasi atau menutup tab (Visibility Change)
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                saveToSupabase(editor.value);
            }
        });

        // 6. Registrasi Service Worker untuk fitur Aplikasi (PWA)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        loadFromSupabase();
    </script>
</body>
</html>
